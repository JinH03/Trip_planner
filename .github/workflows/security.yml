
name: TripCS Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  image-security:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build TripCS Docker image
        run: docker build -t tripcs-api:day30 .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tripcs-api:day30
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'
