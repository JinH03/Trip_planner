
name: TripCS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: sqlite:///./ci_test.db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: tripcs-ci-only-test-secret-key
      GOOGLE_PLACES_API_KEY: ci-mock-api-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Redis connection
        run: |
          python -c "import redis; print(redis.Redis.from_url('redis://localhost:6379/0').ping())"

      - name: Run pytest
        run: python -m pytest -v

  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create CI environment file
        run: |
          {
            echo "DOCKER_DB_PASSWORD=tripcs-ci-only-db-password"
            echo "JWT_SECRET_KEY=tripcs-ci-only-test-secret-key"
            echo "GOOGLE_PLACES_API_KEY=ci-mock-api-key"
          } > .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start containers
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check container health
        run: |
          docker compose ps

          for service in db redis api; do
            container_id=$(docker compose ps -q "$service")

            if [ -z "$container_id" ]; then
              echo "$service container not found"
              exit 1
            fi

            health=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              "$container_id")

            echo "$service : $health"

            if [ "$health" != "healthy" ]; then
              echo "$service is not healthy"
              exit 1
            fi
          done

      - name: Check Alembic migration
        run: |
          container_id=$(docker compose ps -a -q migrate)

          if [ -z "$container_id" ]; then
            echo "Migration container not found"
            exit 1
          fi

          status=$(docker inspect \
            --format '{{.State.Status}}' \
            "$container_id")

          exit_code=$(docker inspect \
            --format '{{.State.ExitCode}}' \
            "$container_id")

          echo "migrate : $status (exit $exit_code)"

          if [ "$status" != "exited" ] || [ "$exit_code" != "0" ]; then
            echo "Alembic migration failed"
            exit 1
          fi

          echo "Alembic migration completed successfully"

      - name: Verify database revision
        run: |
          current=$(docker compose run --rm --no-deps migrate alembic current -q)
          head=$(docker compose run --rm --no-deps migrate alembic heads -q)

          echo "Current revision: $current"
          echo "Head revision: $head"

          if [ -z "$current" ] || [ -z "$head" ]; then
            echo "Alembic revision could not be determined"
            exit 1
          fi

          if [ "$current" != "$head" ]; then
            echo "Database is not at the latest revision"
            exit 1
          fi

          echo "Database revision is up to date"

      - name: Check API endpoints
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          base_url = "http://127.0.0.1:8000"

          with urlopen(f"{base_url}/health/live", timeout=5) as response:
              assert response.status == 200
              live = json.load(response)

          assert live["status"] == "ok"

          with urlopen(f"{base_url}/health/ready", timeout=5) as response:
              assert response.status == 200
              ready = json.load(response)

          assert ready["status"] == "ok"
          assert ready["services"]["database"] == "up"
          assert ready["services"]["redis"] == "up"

          print("TripCS Docker Smoke Test PASSED!")
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop containers
        if: always()
        run: docker compose down
